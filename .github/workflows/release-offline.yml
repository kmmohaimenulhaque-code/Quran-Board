name: Publish Complete Offline Quran Instrument (Desktop + Android + iOS + PWA + Opus Packs)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      audio_format:
        description: 'Compression format (opus = smallest ~260MB/reciter, m4a = universal)'
        required: true
        default: 'opus'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Run Full Verification & Test Suite
  # ---------------------------------------------------------------------------
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run test:node
      - run: npm run test
      - run: npm run build

  # ---------------------------------------------------------------------------
  # JOB 2: Download & Compress Full 114-Surah Offline Audio Packs (24kbps Mono Opus)
  # ---------------------------------------------------------------------------
  build-offline-audio-packs:
    needs: verify-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        reciter:
          - 02-alafasy
          - 03-husary
          - 04-minshawy
          - 05-abdulbasit
          - 06-dosari
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg zip
      - run: npm ci
      - name: Download & Compress Full 114 Surahs (24kbps Mono Opus)
        run: |
          FORMAT="${{ github.event.inputs.audio_format || 'opus' }}"
          node scripts/build-offline-packs.mjs --reciters=${{ matrix.reciter }} --format=$FORMAT --concurrency=8
      - name: Package Reciter Pack
        run: |
          mkdir -p release-packs
          cd public/audio-packs
          zip -r -0 "../../release-packs/quran-pack-${{ matrix.reciter }}.zip" "${{ matrix.reciter }}"
          ls -lh "../../release-packs/quran-pack-${{ matrix.reciter }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.reciter }}
          path: release-packs/quran-pack-${{ matrix.reciter }}.zip
          retention-days: 7

  # ---------------------------------------------------------------------------
  # JOB 3: Native Desktop (Windows, macOS, Linux) + Offline PWA
  # ---------------------------------------------------------------------------
  build-desktop-and-pwa:
    needs: verify-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: ubuntu-22.04
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 file
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> $GITHUB_ENV
          echo "NO_STRIP=true" >> $GITHUB_ENV
      - run: npm ci
      - name: Sync App Version to Git Tag
        run: node scripts/sync-version.mjs
      - name: Bundle All 604 Madani Mushaf Pages Offline
        run: npm run generate:mushaf
      - name: Build Offline PWA Zip (Linux runner)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          npm run build
          cd dist && zip -r ../quran-instrument-pwa-offline.zip .
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-22.04'
        with:
          name: pwa-offline-bundle
          path: quran-instrument-pwa-offline.zip
          retention-days: 7
      - name: Build Native Tauri v2 Desktop Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || 'v1.0.1' }}
          releaseName: 'Quran Instrument ${{ github.ref_name || ''v1.0.1'' }} (Complete Offline Edition)'
          releaseBody: 'Cross-platform Tactile Quran Recitation Instrument (Windows, macOS, Linux, Android APK, iOS IPA, PWA) with all 114 Surahs and 6 Reciters including Qari Muhammad Shamim and Yasser Al-Dosari.'
          releaseDraft: false
          prerelease: false

  # ---------------------------------------------------------------------------
  # JOB 4: Signed Universal Native Android APK (arm64 + armv7 + Custom Logo)
  # ---------------------------------------------------------------------------
  build-android:
    needs: verify-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Configure Pre-installed Android SDK & Install NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "NDK_HOME=$SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - run: npm ci
      - run: node scripts/sync-version.mjs
      - run: npm run generate:mushaf
      - name: Initialize Android, Apply Custom Logo, Build & Sign Universal APK
        run: |
          npx tauri android init --ci
          npx tauri icon public/icons/icon-512.png
          npx tauri android build --apk --target aarch64 --target armv7
          mkdir -p android-out
          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Signing APK: $RAW_APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          "$BUILD_TOOLS/zipalign" -v -p 4 "$RAW_APK" android-out/aligned.apk
          keytool -genkeypair -v -keystore android-out/release.keystore -alias quran_instrument             -keyalg RSA -keysize 2048 -validity 10000             -storepass quran123456 -keypass quran123456             -dname "CN=Quran Instrument, OU=Mobile, O=QuranInstrument, L=Dhaka, S=BD, C=BD"
          "$BUILD_TOOLS/apksigner" sign --ks android-out/release.keystore             --ks-key-alias quran_instrument --ks-pass pass:quran123456 --key-pass pass:quran123456             --out android-out/quran-instrument-android-universal.apk android-out/aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose android-out/quran-instrument-android-universal.apk
          ls -lh android-out/quran-instrument-android-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-out/quran-instrument-android-universal.apk
          retention-days: 7

  # ---------------------------------------------------------------------------
  # JOB 5: Native iOS Build (Unsigned .ipa via Tauri v2 CLI + Custom Logo)
  # ---------------------------------------------------------------------------
  build-ios:
    needs: verify-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - run: npm ci
      - run: node scripts/sync-version.mjs
      - run: npm run generate:mushaf
      - name: Initialize iOS, Apply Logo, Patch Unsigned Signing & Build IPA via Tauri CLI
        run: |
          brew install xcodegen || true
          npx tauri ios init --ci --skip-targets-install
          npx tauri icon public/icons/icon-512.png
          node scripts/patch-ios-unsigned.mjs
          (cd src-tauri/gen/apple && xcodegen generate)
          npx tauri ios build --ci || true
          APP_PATH=$(find src-tauri/gen/apple/build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app bundle not produced"
            exit 1
          fi
          echo "Found built iOS .app: $APP_PATH"
          mkdir -p ios-ipa-stage/Payload
          cp -r "$APP_PATH" ios-ipa-stage/Payload/
          (cd ios-ipa-stage && zip -r "$GITHUB_WORKSPACE/quran-instrument-ios-unsigned.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/quran-instrument-ios-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: quran-instrument-ios-unsigned.ipa
          retention-days: 7

  # ---------------------------------------------------------------------------
  # JOB 6: Attach Android APK, iOS IPA, Offline PWA & All 5 Compressed Opus Packs to Release
  # ---------------------------------------------------------------------------
  publish-all-assets-to-release:
    needs: [build-offline-audio-packs, build-desktop-and-pwa, build-android, build-ios]
    if: always() && (needs.build-desktop-and-pwa.result == 'success' || needs.build-android.result == 'success' || needs.build-offline-audio-packs.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish All Offline Packs, Android APK, iOS IPA & PWA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.1' }}
          name: 'Quran Instrument Offline Release (${{ github.ref_name || ''v1.0.1'' }})'
          files: |
            release-assets/*.zip
            release-assets/*.apk
            release-assets/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
